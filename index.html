<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bear Fit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top border-bottom border-secondary">

<div class="container">

<a class="navbar-brand" href="#inicio">
    <img src="img/logo.png" alt="Bear Fit" style="height:70px;">
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    <span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
    <a class="nav-link" href="#inicio">Inicio</a>
</li>

<li class="nav-item">
    <a class="nav-link" href="#hombre">Hombre</a>
</li>

<li class="nav-item">
    <a class="nav-link" href="#mujer">Mujer</a>
</li>

<li class="nav-item">
    <a class="nav-link"
       href="https://www.instagram.com/bearfit_mx/"
       target="_blank">
        Instagram
    </a>
</li>

</ul>

</div>

</div>

</nav>

<!-- HERO -->

<section id="inicio" class="hero">

    <video class="hero-video" autoplay muted loop playsinline>
        <source src="videos/hero2.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <div class="container hero-content text-center">

        <h5 class="text-uppercase text-pink mb-3">
            Performance Apparel
        </h5>

        <h1 class="display-1 fw-bold">
            STRONG<br>TOGETHER
        </h1>

        <p class="lead mt-4">
            Las mejores prendas de Gymshark, YoungLA y más.
        </p>

        <a href="#hombre" class="btn btn-pink btn-lg mt-3">
            Ver productos
        </a>

    </div>

</section>

<!-- HOMBRE -->

<section id="hombre" class="py-5">

<div class="container">

<div class="text-center mb-4">

    <button class="btn btn-pink filtro-btn active"
        onclick="filtrarProductos('todos', this)">
        Todos
    </button>

    <button class="btn btn-outline-light filtro-btn"
        onclick="filtrarProductos('disponibles', this)">
        Disponibles
    </button>

    <button class="btn btn-outline-light filtro-btn"
        onclick="filtrarProductos('agotados', this)">
        Agotados
    </button>

</div>

<h2 class="text-center mb-5">
    Hombre
</h2>

<div class="row" id="productos-hombre"></div>

</div>

</section>

<!-- MUJER -->

<section id="mujer" class="py-5">

<div class="container">

<h2 class="text-center mb-5">
    Mujer
</h2>

<div class="row" id="productos-mujer"></div>

</div>

</section>

<footer class="py-5 text-center">

Bear Fit © 2026

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>

</html>
